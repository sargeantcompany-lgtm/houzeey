services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: houzeey
      POSTGRES_USER: houzeey
      POSTGRES_PASSWORD: houzeey_local
    ports:
      - "5432:5432"
    volumes:
      - houzeey-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houzeey -d houzeey"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  houzeey-postgres:
